name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/m0-foundation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Temporary lock bootstrap (M0 only)
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install from resolved lock
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Firestore emulator rules tests
        run: npm run test:rules
      - name: Production build
        run: npm run build
      - name: Upload lockfile to commit before M0 completion
        uses: actions/upload-artifact@v4
        with:
          name: m0-package-lock
          path: package-lock.json
          retention-days: 3
