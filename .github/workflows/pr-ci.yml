name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/dependency-security-m0]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit (high+ gate)
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (high+ gate)
        run: npm audit --audit-level=high
      - name: Show resolved dependency versions
        run: npm ls firebase @firebase/rules-unit-testing firebase-tools vitest @grpc/grpc-js --all || true
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Firestore emulator security rules tests
        run: npm run test:rules
      - name: Production build
        run: npm run build
