name: PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify patched gRPC dependency tree
        run: node scripts/check-grpc-lock.mjs
      - name: Production dependency audit (high+ gate, collect evidence)
        id: audit_prod
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit (known upstream findings — visible advisory)
        id: audit_full
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Record full-audit residual risk
        if: steps.audit_full.outcome == 'failure'
        run: |
          echo "::warning::Full dependency audit reports unresolved HIGH findings. Review issue #5 and the current PR before merge."
          echo "### Security audit — follow-up required" >> "$GITHUB_STEP_SUMMARY"
          echo "Full dependency audit remains unresolved. See Issue #5. A green job with audit continue-on-error is NOT a security sign-off." >> "$GITHUB_STEP_SUMMARY"
      - name: Show resolved dependency versions
        run: npm ls firebase @firebase/rules-unit-testing firebase-tools vitest @grpc/grpc-js --all || true
      - name: Check staging isolation harness syntax (no live calls in CI)
        run: node --check scripts/staging-auth-isolation.mjs
      - name: Check M2 live acceptance script syntax (no staging access in CI)
        run: node --check scripts/staging-m2-live-acceptance.mjs
      - name: Offline tests for safe REST write builders (no staging credentials)
        run: node --test tests/tools/m2-live-payloads.test.mjs
      - name: Check staging release script syntax (no deployment in CI)
        run: bash -n scripts/release-m2-staging.sh
      - name: Check M3 staging release script syntax (no deployment in CI)
        run: bash -n scripts/release-m3-staging.sh
      - name: Check M3.2a staging script syntax (no deployment in CI)
        run: bash -n scripts/release-m3-2a-staging.sh
      - name: Validate joined-room composite index configuration
        run: node scripts/check-m2-index.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Firestore emulator security rules tests
        run: npm run test:rules
      - name: Production build
        run: npm run build
      - name: Enforce production dependency audit after regression tests
        if: ${{ always() && steps.audit_prod.outcome == 'failure' }}
        run: |
          echo "::error::Production dependency audit has unresolved High+ findings. PR is blocked; see Issue #5."
          exit 1
