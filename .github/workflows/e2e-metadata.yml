name: E2E Dependency Metadata
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned Playwright npm tarball metadata
        run: |
          set -eu
          for pkg in '@playwright/test@1.56.1' 'playwright@1.56.1' 'playwright-core@1.56.1'; do
            echo "PLAYWRIGHT_REGISTRY_ENTRY: $pkg"
            npm view "$pkg" dist.integrity dist.tarball dependencies --json
          done
