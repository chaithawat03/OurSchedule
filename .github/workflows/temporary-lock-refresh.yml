name: Temporary dependency lock refresh
on:
  push:
    branches: [fix/dependency-security-m0]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'chaithawat03/OurSchedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-m0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies and update lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile (feature branch only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate locked dependency graph"
            git push origin HEAD:fix/dependency-security-m0
          fi
