name: Temporary M0 Lockfile Bootstrap
on:
  push:
    branches: [feature/m0-foundation]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'chaithawat03/OurSchedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m0-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(m0): commit generated npm lockfile"
            git push origin HEAD:feature/m0-foundation
          fi
