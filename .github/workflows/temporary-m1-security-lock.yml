name: TEMP M1 security lockfile regeneration
on:
  push:
    branches: [feature/m1-google-identity]
permissions:
  contents: write
jobs:
  resolve:
    if: github.repository == 'chaithawat03/OurSchedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m1-google-identity
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve patched transitive dependencies without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(m1): resolve patched grpc-js lockfile"
            git push origin HEAD:feature/m1-google-identity
          fi
